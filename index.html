<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediHub</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f7fa;color:#17324d}header{background:#087e91;color:white;padding:28px 18px;text-align:center}header h1{margin:0;font-size:34px}main{max-width:650px;margin:auto;padding:20px}.panel{background:white;padding:22px;border-radius:16px;margin:16px 0;box-shadow:0 3px 14px #0001}select,button{width:100%;padding:13px;margin:8px 0 17px;border:1px solid #cad6dc;border-radius:9px;font-size:16px}button{background:#087e91;color:white;border:0;font-weight:bold}label{font-weight:bold}.item{padding:15px;background:#eaf5f7;border-radius:10px;margin:10px 0}footer{text-align:center;padding:20px;color:#607080}
</style>
</head>
<body>
<header><h1>🩺 MediHub</h1><p>Gjithçka për studentët e mjekësisë</p></header>
<main>
<div class="panel">
<h2>Gjej materialet mësimore</h2>
<label>Drejtimi</label>
<select id="drejtimi"><option>Mjekësi e Përgjithshme</option><option>Stomatologji</option><option>Farmaci</option><option>Infermieri</option></select>
<label>Viti</label>
<select id="viti" onchange="ndrysho()"><option value="1">Viti I</option><option value="2">Viti II</option><option value="3">Viti III</option></select>
<label>Lënda</label><select id="lenda"></select>
<button onclick="shfaq()">Shfaq materialet</button>
</div>
<div class="panel" id="rezultati" hidden></div>
<div class="panel"><h2>Funksionet e MediHub</h2><div class="item">📚 Biblioteka digjitale</div><div class="item">📝 MediExam – Teste</div><div class="item">🧠 MediCards – Flashcards</div><div class="item">📅 MediPlan – Planifikimi</div></div>
</main><footer>MediHub © 2026</footer>
<script>
const lendet={"1":["Anatomi","Histologji","Biologji Mjekësore"],"2":["Fiziologji","Biokimi","Embriologji"],"3":["Patologji","Mikrobiologji","Farmakologji"]};
function ndrysho(){let v=document.getElementById("viti").value;document.getElementById("lenda").innerHTML=lendet[v].map(x=>'<option>'+x+'</option>').join("");}
function shfaq(){let l=document.getElementById("lenda").value;let r=document.getElementById("rezultati");r.hidden=false;r.innerHTML="<h2>"+l+"</h2><p>📚 Librat dhe tekstet</p><p>📄 Skriptat dhe ligjëratat</p><p>📝 Pyetjet e provimeve</p><p>Materialet do të shtohen së shpejti.</p>";}
ndrysho();
</script>
</body></html>
